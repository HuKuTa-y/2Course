version: '3.8'

services:
  api-law-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: law-api
    ports:
      - "5000:5000"
    volumes:
      # Монтируем JSON файлы только для чтения (:ro)
      - ./codeks.json:/app/codeks.json:ro
      - ./laws.json:/app/laws.json:ro
      - ./articles_full.json:/app/articles_full.json:ro
      - ./text_new_articles.json:/app/text_new_articles.json:ro
    environment:
      - PYTHONUNBUFFERED=1
      - DATA_DIR=/app
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - law-network
    # Ограничения ресурсов (опционально)
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

networks:
  law-network:
    driver: bridge